name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test storage persistence, integrity and UI downloads
        run: npm ci --no-audit --no-fund && npm test

      - name: Type-check backend and gateway
        run: |
          for pkg in backend gateway; do
            (cd "$pkg" && npm install --no-audit --no-fund && npx tsc --noEmit -p .)
          done

      - name: Verify the actual Node storage pipeline
        run: |
          (cd backend && npm run build)
          node --test tests/backend-check.cjs

      # Relative API paths keep requests inside the project page scope.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r gateway/public/. _site/
          cp gateway/demo/sw.js gateway/demo/boot.js _site/
          sed -i 's#<script src="app.js"></script>#<script src="boot.js"></script>#' _site/index.html
          grep -q 'const API = "api/files";' _site/app.js
          grep -q 'jsonRequest("healthz")' _site/app.js
          grep -q 'src="boot.js"' _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
