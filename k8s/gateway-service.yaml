apiVersion: v1
kind: Service
metadata:
  name: mini-dropbox-gateway
  namespace: mini-dropbox
spec:
  selector:
    app: mini-dropbox-gateway
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: LoadBalancer # on EKS this provisions an AWS NLB/ELB; use ClusterIP + ingress.yaml instead if you prefer
